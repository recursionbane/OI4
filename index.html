<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>OI4 · Decision desk</title>
<script>(()=>{let theme;try{theme=localStorage.getItem('oi4-theme')}catch{}document.documentElement.dataset.theme=theme==='light'||theme==='dark'?theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'})();</script>
<style>
:root{color-scheme:light;--canvas:#f4f6f8;--paper:#fff;--ink:#233447;--muted:#566879;--line:#d7e0e9;--field:#f7f9fb;--accent:#456e9d;--action:#365f8c;--action-ink:#fff;--focus:#6793c5;--error:#954529;--shadow:#17314f12}
:root[data-theme="dark"]{color-scheme:dark;--canvas:#111b26;--paper:#1b2938;--ink:#e6edf5;--muted:#a8b7c8;--line:#3a4b5e;--field:#152231;--accent:#9fc2ec;--action:#9fc2ec;--action-ink:#142334;--focus:#b2d1f5;--error:#f0ab8f;--shadow:#0003}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
.unlock{min-height:100svh;display:grid;place-items:center;padding:28px}.unlock-card{width:100%;max-width:480px;background:var(--paper);border:1px solid var(--line);padding:40px;border-radius:16px;box-shadow:0 18px 70px var(--shadow)}
.unlock-header{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{color:var(--accent);font-size:21px;letter-spacing:3px;font-weight:800}h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:40px;font-weight:500;line-height:1.15;letter-spacing:-1px;margin:36px 0 28px}
label{display:block;font-size:15px;font-weight:650;margin:0 0 9px}input{width:100%;font:inherit;font-size:18px;color:var(--ink);padding:14px;border:1px solid var(--line);border-radius:7px;background:var(--field)}
button{font:inherit;cursor:pointer}#open{margin-top:18px;width:100%;border:0;background:var(--action);color:var(--action-ink);font-size:17px;font-weight:650;border-radius:7px;padding:15px}button:disabled{opacity:.6}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--ink);font-size:14px;font-weight:550;white-space:nowrap}.theme-toggle:hover{background:var(--field)}.theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .theme-moon,[data-theme="light"] .theme-sun{display:none}input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}#status{font-size:16px;line-height:1.5;color:var(--error);margin:18px 0 0}#status:empty{display:none}
@media(max-width:480px){.unlock{padding:20px}.unlock-card{padding:28px 24px}.unlock-header{gap:16px}h1{font-size:36px;margin-top:32px}.theme-toggle{font-size:14px}}
</style></head>
<body><main class="unlock"><section class="unlock-card" aria-labelledby="unlock-title"><div class="unlock-header"><div class="brand">OI4</div><button class="theme-toggle" data-theme-toggle type="button" aria-label="Switch to dark mode" aria-pressed="false"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-theme-label>Dark mode</span></button></div><h1 id="unlock-title">Decision desk</h1><form id="unlock"><label for="passphrase">Passphrase</label><input id="passphrase" type="password" autocomplete="off" required autofocus><button id="open" type="submit">Unlock dashboard</button><p role="status" id="status"></p></form></section></main>
<script>
(()=>{const button=document.querySelector('[data-theme-toggle]');const render=()=>{const dark=document.documentElement.dataset.theme==='dark';button.setAttribute('aria-pressed',String(dark));button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');button.querySelector('[data-theme-label]').textContent=dark?'Light mode':'Dark mode'};render();button.addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('oi4-theme',theme)}catch{}render()})})();
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function script(text){const url=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}finally{URL.revokeObjectURL(url)}}
window.addEventListener('oi4-lock',()=>location.reload());
document.getElementById('unlock').addEventListener('submit',async event=>{
event.preventDefault();const button=document.getElementById('open'),status=document.getElementById('status'),field=document.getElementById('passphrase');button.disabled=true;status.textContent='Unlocking…';
try{
 const response=await fetch('./bundle.json',{cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('bundle');const e=await response.json();
 if(e.version!==1||e.iterations!==600000)throw Error('version');
 const source=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(e.salt),iterations:e.iterations,hash:'SHA-256'},source,{name:'AES-GCM',length:256},false,['decrypt']);
 const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(e.nonce),additionalData:new TextEncoder().encode('OI4/v1')},key,decode(e.ciphertext));
 const unpacked=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 const payload=JSON.parse(unpacked);field.value='';
 window.OI4_DATA=payload.snapshot;await script(payload.runtime);const go=new Go();const result=await WebAssembly.instantiate(decode(payload.wasm),go.importObject);go.run(result.instance).catch(()=>{});
 document.querySelector('head style')?.remove();const style=document.createElement('style');style.textContent=payload.css;document.head.appendChild(style);
 document.body.replaceChildren();const app=document.createElement('div');app.id='app';document.body.appendChild(app);await script(payload.js);
}catch(error){if(document.getElementById('status')){status.textContent='Unable to unlock. Check the passphrase and try again.';button.disabled=false;field.focus()}else{document.body.textContent='Unable to open the dashboard. Reload to retry.'}}
});
</script></body></html>
